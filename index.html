<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>소원 등불</title>
<meta name="description" content="오늘의 마음을 등불에 담아 밤 호수에 띄워 보세요. 같은 호수에 온 사람들과 등불을 읽고 ♡를 보내고, 별똥별에 함께 소원을 빌어요. 설치 없이 휴대폰에서 바로." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="소원 등불" />
<meta property="og:title" content="소원 등불 · 밤 호수에 띄우는 마음 한 줄" />
<meta property="og:description" content="오늘의 마음을 등불에 담아 밤 호수에 띄워 보세요. 같은 호수의 사람들과 ♡를 나누고 별똥별에 함께 소원을 빌어요." />
<meta property="og:url" content="https://wish-lanterns.ycyeom.workers.dev/" />
<meta property="og:image" content="https://wish-lanterns.ycyeom.workers.dev/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="ko_KR" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://wish-lanterns.ycyeom.workers.dev/og.jpg" />
<meta name="theme-color" content="#0b0e26" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body style="margin:0;background:#050816">
<canvas id="c"></canvas>

<div id="ui">
  <div id="title" class="screen">
    <div class="title-inner">
      <div class="title-glyph">🏮</div>
      <h1>소원 등불</h1>
      <p>오늘의 마음을 등불에 담아 호수에 띄워 보세요</p>
      <div class="hint pulse">화면을 눌러 시작</div>
      <button id="langBtn" class="lang-btn">🌐 English</button>
    </div>
  </div>

  <div id="hud" class="hidden">
    <button id="stats" title="다른 호수로 가기"></button>
    <div id="lakePanel" class="lake-panel hidden">
      <div class="mp-head"><h2>호수 고르기</h2><button class="close" data-close="lakes">✕</button></div>
      <div class="lake-sub" id="lakeSub">가고 싶은 호수를 눌러 보세요</div>
      <div class="lake-grid" id="lakeGrid"></div>
    </div>
    <button id="invite" class="icon-btn invite" title="친구 초대 링크 복사">🔗</button>
    <button id="mute" class="icon-btn" title="소리">🔊</button>
    <button id="music" class="icon-btn music" title="배경음악">🎵</button>
    <button id="diaryBtn" class="icon-btn diary" title="나의 등불 기록">📖</button>
    <button id="boatBtn" class="boat-btn hidden">⛵ 배 타기</button>
    <button id="digBtn" class="boat-btn dig-btn hidden">✋ 모래 파 보기</button>
    <button id="emoteBtn" class="emote-btn" title="행동 (1~5)">😊</button>
    <div id="emoteBar" class="emote-bar hidden">
      <button data-emote="wave" title="손 흔들기 (1)">👋<span>인사</span></button>
      <button data-emote="bow" title="꾸벅 (2)">🙇<span>꾸벅</span></button>
      <button data-emote="jump" title="폴짝 (3)">🎉<span>폴짝</span></button>
      <button data-emote="heart" title="하트 (4)">💕<span>하트</span></button>
      <button data-emote="sit" title="앉기 (5)">🪑<span>앉기</span></button>
    </div>
    <button id="shareBtn" class="share-btn hidden">📸 이 순간 남기기</button>
    <button id="wishBtn" class="wish-btn hidden">🌠 별똥별에 소원 빌기</button>
    <div id="tip">WASD·방향키나 땅을 눌러 걸어요 · 화면을 끌거나 Q/E로 둘러봐요 · 등불을 누르면 한마디가 보여요</div>
    <button id="launchBtn" class="main-btn">🏮 물가로 가서 등불 띄우기</button>
  </div>

  <div id="compose" class="panel hidden">
    <button class="close" data-close="compose">✕</button>
    <h2>나의 등불</h2>
    <div class="label">등불 색</div>
    <div id="swatches"></div>
    <div class="label">한마디 <span class="sub">(비워도 괜찮아요)</span></div>
    <button id="topic" class="topic" title="오늘의 주제로 쓰기"></button>
    <div class="input-wrap">
      <input id="msg" maxlength="30" placeholder="마음을 짧게 적어 보세요" autocomplete="off" />
      <span id="count">0/30</span>
    </div>
    <div id="presets"></div>
    <div class="label where">어디로 보낼까요?</div>
    <div class="modes">
      <button class="mode on" data-mode="water">🌊 물 위로</button>
      <button class="mode" data-mode="sky">✨ 하늘로</button>
    </div>
    <button id="send" class="main-btn wide">띄우기</button>
  </div>

  <div id="card" class="panel hidden">
    <button class="close" data-close="card">✕</button>
    <div id="cardWho"></div>
    <div id="cardMsg"></div>
    <div class="card-actions">
      <button id="heartBtn" class="heart-btn">♡ <span id="heartCount">0</span></button>
      <button id="hideBtn" class="ghost-btn">숨기기</button>
      <button id="reportBtn" class="ghost-btn report">🚩 신고</button>
      <button id="photoBtn" class="ghost-btn">📸 사진</button>
    </div>
  </div>

  <div id="diary" class="panel hidden">
    <button class="close" data-close="diary">✕</button>
    <h2>나의 등불 기록</h2>
    <div id="diarySum" class="diary-sum"></div>
    <button id="seeStars" class="topic">⭐ 내 별자리 보러 가기</button>
    <div id="diaryList" class="diary-list"></div>
  </div>

  <div id="musicPanel" class="music-panel hidden">
    <div class="mp-head">
      <h2>배경음악</h2>
      <button id="musicOn" class="mp-toggle on" role="switch" aria-checked="true"><span class="knob"></span></button>
      <button class="close" data-close="music">✕</button>
    </div>
    <div class="mp-moods" id="moods">
      <button class="chip mood" data-mood="calm">🌙 잔잔</button>
      <button class="chip mood" data-mood="warm">🕯️ 따뜻</button>
      <button class="chip mood" data-mood="dreamy">🫧 몽환</button>
      <button class="chip mood" data-mood="starry">✨ 별빛</button>
    </div>
    <div id="sliders"></div>
    <button id="musicReset" class="ghost-btn mp-reset">기본값으로</button>
  </div>

  <div id="notePanel" class="note-panel hidden">
    <div class="note-title">📜 모래 속 쪽지</div>
    <div id="noteText" class="note-text"></div>
    <div id="noteSong" class="song-dots big"></div>
    <div id="noteFoot" class="note-foot"></div>
    <button id="noteOk" class="ghost-btn">접어 두기</button>
  </div>

  <div id="sharePanel" class="panel share-panel hidden">
    <button class="close" data-close="share">✕</button>
    <h2>이 순간을 남겨요</h2>
    <img id="shareImg" alt="등불 사진 카드" />
    <div class="card-actions">
      <button id="shareGo" class="heart-btn">공유하기</button>
      <button id="shareSave" class="ghost-btn">저장하기</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <div id="netline"></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
